name: Collecte FxTwitter et GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6,18 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: Effectuer une collecte FxTwitter avant la publication
        type: boolean
        default: true

concurrency:
  group: stats-souverain-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collecter et archiver (FxTwitter uniquement)
        id: collect
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        continue-on-error: true
        run: npm run collect
        env:
          MAX_PAGES: '30'
          LOOKBACK_DAYS: '90'
      - name: Conserver les archives et les relevés dans le dépôt
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: archive des relevés FxTwitter"
            git push origin HEAD:main
          fi
      - name: Signaler une collecte partielle
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::Collecte partielle. Les archives ont été conservées ; consulter les manifestes data/runs/.'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
